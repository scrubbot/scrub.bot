name: Bug report
description: Something did the wrong thing, crashed, or changed data it should not have.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please do not paste real personal data; a few made-up rows that show the problem are perfect."
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options: ["Playground (www.scrub.bot/play)", "CLI (scrub)", "scrub serve (local engine)", "REST API", "MCP server", "Docs or website"]
    validations:
      required: true
  - type: input
    id: handler
    attributes:
      label: Handler or command
      placeholder: "clean/pii, or: scrub clean/text/case contacts.csv --config mode=name"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or sample data to reproduce
      description: "The smallest input that shows the problem."
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "output of: scrub --version"
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: "macOS 15, Python 3.13"
